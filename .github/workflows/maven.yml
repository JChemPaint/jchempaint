name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ 8, 11, 25 ]
    name: Java ${{ matrix.java }}


    steps:
    - uses: actions/checkout@v7

    - name: Set up Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java }}
        cache: maven

    - name: Build with Maven
      run: mvn clean install -DskipTests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25
          cache: maven

      - name: Install gettext and at-spi2-core
        run: sudo apt install -y gettext at-spi2-core

      # FlatLAF is the default but for some reason messes with the tests
      - name: Set LAF
        run: |
          mkdir ~/.jchempaint 
          echo "LookAndFeelClass=javax.swing.plaf.metal.MetalLookAndFeel" > ~/.jchempaint/properties

      - name: Build with Maven (on X Window Virtual Framebuffer)
        run: xvfb-run --auto-servernum mvn clean install --B -ntp -Dstyle.color=always

      - name: Publish Test Report
        id: report
        uses: mikepenz/action-junit-report@v6
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: 'core/target/surefire-reports/TEST-*.xml'
          comment: true
