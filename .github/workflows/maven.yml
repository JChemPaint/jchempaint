name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ 8, 11, 25 ]
    name: Java ${{ matrix.java }}


    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java }}
        cache: maven

    - name: Build with Maven
      run: mvn clean install -DskipTests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 25
          cache: maven

      - name: Install gettext
        run: sudo apt install -y gettext

      # FlatLAF is the default but for some reason messes with the tests
      - name: Set LAF
        run: |
          mkdir ~/.jchempaint 
          echo "LookAndFeelClass=com.sun.java.swing.plaf.gtk.GTKLookAndFeel" > ~/.jchempaint/properties

      - name: Build with Maven (on X Window Virtual Framebuffer)
        run: xvfb-run --auto-servernum mvn clean install --T 1C verify --B -ntp -Dstyle.color=always
